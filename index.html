<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>Jewlery Mock up</title>

</head>
<body>

<div class="hero-section">
  <header class="hero-heading">Everyday elegance, effortlessly yours. </header>
  <button class="hero-button" >Explore collections</button>
</div>

  
</section>
 



  <section class="shopping-section">
  <h2 class="shopping-heading">Curated Jewelry You'll Love </h2>
    

<div class="slider">
  <div class="slides">
    <button class="prev" onclick="prevSlide()">&#10094</button>
    <image class="slide" src="images/left-product.jpg">
    <image class="slide" src="images/center.jpg">
    <image class="slide" src="images/right-product.jpg">
      <button class="next" onclick="nextSlide()">&#10095</button>
    </div>
    <div class="controls">
    
    
    </div>   
  </div>
<button class="shop-now" onclick="nextSlide">shop now</button>

  </section>

  

<section class="contact-section">
  
  <h2 class="contact-heading">Questions? Let’s Talk</h2>
  <form>
    
    <label>NAME</label>
    <input>
    <label>EMAIL</label>
    <input>
    <button class="submit">Submit</button>

    </form>



</section>

<footer>
<!-- add FAQ and other resourses copy it from another page lol  -->

</footer>

  

<div class="popup" id="popup" >
  <div class="countdownbox">

    <div class="hero">
      <h1>SALE ENDS </h1>
  
      <div class="timebox">
        <div class="time">
          <h2 id="Days">00</h2>
          <p>days</p>
        </div>
  
        <div class="time">
          <h2 id="Hours">00</h2>
          <p>Hours</p>
        </div>
  
        <div class="time">
          <h2 id="Minutes">00</h2>
          <p>Minutes</p>
        </div>
  
        
        <div class="time">
          <h2 id="Seconds">00</h2>
          <p>Seconds</p>
        </div>
      </div>
      
  <button id="closeButton" >close</button>
    </div>
  </div>
  

</div>





<script src="index.js"></script>








</body>
</html>
